[project]
name = "yoshkar-ola-public-mcp"
version = "0.1.8"
description = "Public MCP server for open datasets of the urban district Yoshkar-Ola"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.3,<4",
    "httpx>=0.28,<1",
    "starlette>=0.40,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
yoshkar-ola-public-mcp = "yoshkar_ola_public_mcp.server:main"
yoshkar-ola-public-mcp-stdio = "yoshkar_ola_public_mcp.server:main_stdio"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
